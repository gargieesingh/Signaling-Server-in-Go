<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Business Calling System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📞 WhatsApp Business Calling</h1>
            <p class="subtitle">Connect customers with businesses seamlessly</p>
        </header>

        <div class="grid">
            <!-- Business Registration Card -->
            <div class="card">
                <div class="card-header">
                    <h2>🏢 Register Business</h2>
                </div>
                <div class="card-body">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="businessName">Business Name</label>
                            <input type="text" id="businessName" placeholder="Enter business name" required>
                        </div>
                        <div class="form-group">
                            <label for="whatsappNumber">WhatsApp Number</label>
                            <input type="tel" id="whatsappNumber" placeholder="+1234567890" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Register Business</button>
                    </form>
                    <div id="registerStatus" class="status-message"></div>
                </div>
            </div>

            <!-- Call Initiation Card -->
            <div class="card">
                <div class="card-header">
                    <h2>📱 Initiate Call</h2>
                </div>
                <div class="card-body">
                    <form id="callForm">
                        <div class="form-group">
                            <label for="customerName">Your Name</label>
                            <input type="text" id="customerName" placeholder="Enter your name" required>
                        </div>
                        <div class="form-group">
                            <label for="customerPhone">Your Phone Number</label>
                            <input type="tel" id="customerPhone" placeholder="+1234567890" required>
                        </div>
                        <div class="form-group">
                            <label for="businessSelect">Select Business</label>
                            <select id="businessSelect" required>
                                <option value="">-- Select a business --</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success">Start Call</button>
                    </form>
                    <div id="callStatus" class="status-message"></div>
                </div>
            </div>
        </div>

        <!-- Call Status Display -->
        <div id="activeCallCard" class="card" style="display: none;">
            <div class="card-header">
                <h2>📞 Active Call</h2>
            </div>
            <div class="card-body">
                <div class="call-info">
                    <div class="info-row">
                        <span class="label">Customer:</span>
                        <span id="activeCustomerName">-</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Business:</span>
                        <span id="activeBusinessName">-</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Status:</span>
                        <span id="activeCallStatus" class="status-badge">-</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Duration:</span>
                        <span id="activeDuration">-</span>
                    </div>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- Call History Card -->
        <div class="card">
            <div class="card-header">
                <h2>📋 Call History</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label for="historyBusinessSelect">Select Business</label>
                    <select id="historyBusinessSelect">
                        <option value="">-- Select a business --</option>
                    </select>
                </div>
                <button id="loadHistoryBtn" class="btn btn-secondary">Load History</button>
                <div id="historyContainer" class="history-container"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
