  <body>
    <h1>Video Chat</h1>

    <div class="join-controls">
      <input type="text" id="roomId" placeholder="Enter Room ID" />
      <button onclick="joinRoom()">Join Room</button>
    </div>

    <div id="connectionStatus" class="status">Not connected</div>

    <div class="video-container">
      <div class="video-wrapper">
        <div class="video-overlay"></div>
        <div class="video-title">My Video</div>
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="video-controls">
          <button
            class="control-button"
            id="videoBtn"
            onclick="toggleVideo()"
            aria-label="Toggle Video"
          ></button>
          <button
            class="control-button"
            id="audioBtn"
            onclick="toggleAudio()"
            aria-label="Toggle Audio"
          ></button>
        </div>
      </div>
      <div class="video-wrapper">
        <div class="video-overlay"></div>
        <div class="video-title">Remote Video</div>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>

    <script>
      let localStream;
      let peerConnection;
      let ws;
      let roomId;
      let peerId;
      let isVideoEnabled = true;
      let isAudioEnabled = true;

      const servers = {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun2.l.google.com:19302" },
          { urls: "stun:stun3.l.google.com:19302" },
          { urls: "stun:stun4.l.google.com:19302" },
        ],
      };

      const peerConfig = {
        iceServers: servers.iceServers,
        iceCandidatePoolSize: 10,
      };

      async function joinRoom() {
        roomId = document.getElementById("roomId").value;
        if (!roomId) {
          alert("Please enter a room ID");
          return;
        }

        peerId = Math.random().toString(36).substr(2, 9);

        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true,
          });
          document.getElementById("localVideo").srcObject = localStream;

          ws = new WebSocket(`ws://${window.location.host}/ws`);

          await new Promise((resolve) => {
            ws.onopen = () => resolve();
          });

          setupWebSocket();
          createPeerConnection();

          ws.send(
            JSON.stringify({
              type: "join",
              roomId: roomId,
              peerId: peerId,
            })
          );

          document.getElementById("connectionStatus").textContent =
            "Connected to room: " + roomId;
          updateMediaButtons();
        } catch (err) {
          console.error("Error in join room:", err);
          alert("Error joining room: " + err.message);
        }
      }

      function setupWebSocket() {
        ws.onmessage = async function (event) {
          const message = JSON.parse(event.data);
          console.log("Received message:", message.type);

          switch (message.type) {
            case "peer-joined":
              console.log("Peer joined:", message.peerId);
              if (peerId > message.peerId) {
                try {
                  console.log(
                    "Creating offer as initiator for peer:",
                    message.peerId
                  );
                  if (
                    !peerConnection ||
                    peerConnection.connectionState === "closed"
                  ) {
                    createPeerConnection();
                  }

                  const offer = await peerConnection.createOffer({
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: true,
                  });

                  console.log("Setting local description:", offer.type);
                  await peerConnection.setLocalDescription(offer);

                  console.log("Sending offer to peer:", message.peerId);
                  ws.send(
                    JSON.stringify({
                      type: "offer",
                      roomId: roomId,
                      peerId: message.peerId,
                      payload: offer,
                    })
                  );
                } catch (err) {
                  console.error("Error creating offer:", err);
                }
              } else {
                console.log("Waiting for offer from peer:", message.peerId);
                if (!peerConnection) {
                  createPeerConnection();
                }
              }
              break;

            case "offer":
              await handleOffer(message);
              break;

            case "answer":
              await handleAnswer(message);
              break;

            case "ice-candidate":
              await handleIceCandidate(message);
              break;

            case "peer-left":
              handlePeerLeft();
              break;
          }
        };

        ws.onerror = function (error) {
          console.error("WebSocket Error:", error);
        };

        ws.onclose = function () {
          console.log("WebSocket Connection Closed");
        };
      }

      function createPeerConnection() {
        if (peerConnection) {
          peerConnection.close();
        }

        peerConnection = new RTCPeerConnection(peerConfig);
        console.log("Created new peer connection");

        localStream.getTracks().forEach((track) => {
          const sender = peerConnection.addTrack(track, localStream);
          console.log(
            "Added local track:",
            track.kind,
            "with sender:",
            sender.toString()
          );
        });

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            console.log("New ICE candidate:", event.candidate.type);
            ws.send(
              JSON.stringify({
                type: "ice-candidate",
                roomId: roomId,
                peerId: peerId,
                payload: event.candidate,
              })
            );
          } else {
            console.log("All ICE candidates gathered");
          }
        };

        peerConnection.onconnectionstatechange = () => {
          const state = peerConnection.connectionState;
          console.log("Connection state changed:", state);
          document.getElementById("connectionStatus").textContent =
            "Connection state: " + state;

          if (state === "failed") {
            console.log("Connection failed, restarting peer connection");
            createPeerConnection();
          }
        };

        peerConnection.oniceconnectionstatechange = () => {
          const state = peerConnection.iceConnectionState;
          console.log("ICE connection state:", state);

          if (state === "disconnected" || state === "failed") {
            console.log("ICE connection failed, checking tracks");
            checkAndRestartTracks();
          }
        };

        peerConnection.onsignalingstatechange = () => {
          console.log("Signaling state:", peerConnection.signalingState);
        };

        peerConnection.ontrack = (event) => {
          console.log(
            "Received remote track:",
            event.track.kind,
            "streams:",
            event.streams.length
          );

          const remoteVideo = document.getElementById("remoteVideo");
          if (!remoteVideo.srcObject) {
            remoteVideo.srcObject = new MediaStream();
          }

          const stream = remoteVideo.srcObject;
          if (!stream.getTracks().some((t) => t.id === event.track.id)) {
            stream.addTrack(event.track);
            console.log("Added track to remote stream:", event.track.kind);
          }

          event.track.onmute = () =>
            console.log("Remote track muted:", event.track.kind);
          event.track.onunmute = () =>
            console.log("Remote track unmuted:", event.track.kind);
          event.track.onended = () =>
            console.log("Remote track ended:", event.track.kind);
        };
      }

      async function handleOffer(message) {
        try {
          console.log("Handling offer from peer:", message.peerId);

          if (!peerConnection || peerConnection.signalingState === "closed") {
            console.log("Creating new peer connection for offer");
            createPeerConnection();
          }

          if (peerConnection.signalingState !== "stable") {
            console.log("Signaling state not stable, resetting connection");
            await Promise.all([
              peerConnection.setLocalDescription({ type: "rollback" }),
              peerConnection.setRemoteDescription(
                new RTCSessionDescription(message.payload)
              ),
            ]);
          } else {
            await peerConnection.setRemoteDescription(
              new RTCSessionDescription(message.payload)
            );
          }

          console.log("Creating answer");
          const answer = await peerConnection.createAnswer();
          console.log("Setting local description (answer)");
          await peerConnection.setLocalDescription(answer);

          console.log("Sending answer to peer:", message.peerId);
          ws.send(
            JSON.stringify({
              type: "answer",
              roomId: roomId,
              peerId: message.peerId,
              payload: answer,
            })
          );
        } catch (err) {
          console.error("Error handling offer:", err);
        }
      }

      async function handleAnswer(message) {
        try {
          console.log("Handling answer from peer:", message.peerId);
          if (peerConnection.signalingState === "have-local-offer") {
            await peerConnection.setRemoteDescription(
              new RTCSessionDescription(message.payload)
            );
            console.log("Set remote description from answer successfully");
          } else {
            console.warn(
              "Received answer but peer connection is in state:",
              peerConnection.signalingState
            );
          }
        } catch (err) {
          console.error("Error handling answer:", err);
        }
      }

      async function handleIceCandidate(message) {
        if (peerConnection && peerConnection.remoteDescription) {
          try {
            console.log("Adding ICE candidate from peer:", message.peerId);
            await peerConnection.addIceCandidate(
              new RTCIceCandidate(message.payload)
            );
            console.log("Added ICE candidate successfully");
          } catch (e) {
            console.error("Error adding received ice candidate:", e);
          }
        } else {
          console.warn("Received ICE candidate but peer connection is not ready");
        }
      }

      function handlePeerLeft() {
        document.getElementById("remoteVideo").srcObject = null;
        if (peerConnection) {
          peerConnection.close();
          peerConnection = null;
        }
      }

      function toggleVideo() {
        if (localStream) {
          isVideoEnabled = !isVideoEnabled;
          localStream.getVideoTracks().forEach((track) => {
            track.enabled = isVideoEnabled;
          });
          updateMediaButtons();
        }
      }

      function toggleAudio() {
        if (localStream) {
          isAudioEnabled = !isAudioEnabled;
          localStream.getAudioTracks().forEach((track) => {
            track.enabled = isAudioEnabled;
          });
          updateMediaButtons();
        }
      }

      function updateMediaButtons() {
        const videoBtn = document.getElementById("videoBtn");
        const audioBtn = document.getElementById("audioBtn");

        // Toggle the 'off' class to change icons
        if (videoBtn) {
          videoBtn.classList.toggle("off", !isVideoEnabled);
          videoBtn.setAttribute("aria-label", isVideoEnabled ? "Turn Off Video" : "Turn On Video");
        }

        if (audioBtn) {
          audioBtn.classList.toggle("off", !isAudioEnabled);
          audioBtn.setAttribute("aria-label", isAudioEnabled ? "Mute Audio" : "Unmute Audio");
        }
      }

      function checkAndRestartTracks() {
        const remoteVideo = document.getElementById("remoteVideo");
        const stream = remoteVideo.srcObject;

        if (stream) {
          const videoTrack = stream.getVideoTracks()[0];
          const audioTrack = stream.getAudioTracks()[0];

          console.log("Video track state:", videoTrack?.readyState);
          console.log("Audio track state:", audioTrack?.readyState);

          if (
            videoTrack?.readyState === "ended" ||
            audioTrack?.readyState === "ended"
          ) {
            console.log("Tracks ended, negotiating new connection");
            if (peerConnection && peerConnection.connectionState === "connected") {
              peerConnection.restartIce();
            }
          }
        }
      }
    </script>
  </body>
</html>
